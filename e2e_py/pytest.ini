[pytest]
testpaths = tests
python_files = test_*.py
timeout = 180
timeout_func_only = true
; SAFETY RAIL: real-money lane is OPT-IN, same as the main suite's pytest.ini.
; run it explicitly:  pytest -m trades
markers =
    trades: places real orders / moves real funds on live UAT; run deliberately.
; mirrors the old e2e/playwright.config.ts's `use` block:
addopts = --browser chromium --screenshot only-on-failure --tracing retain-on-failure -m "not trades"
