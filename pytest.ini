[pytest]
testpaths = suites tests
python_files = test_*.py
addopts = -ra -m "not trades and not serial"
; SAFETY RAIL (stronger than the TS original): trading lanes are OPT-IN.
; default run = @stateless + @smoke + offline units. run trades explicitly:
;   pytest -m trades          (overrides the default marker filter)
;   pytest -m serial -p no:cacheprovider   (fee-tier flow: ONE process, no xdist)
; NEVER add a retry/rerun plugin to trades/serial — a retry re-places live orders.
; UI e2e tests are a separate Node project (e2e/), not part of this pytest suite at all —
; see e2e/README or AGENTS.md. `npm test` there, not pytest.
markers =
    stateless: independent, parallel-safe, no funding, no trades. default lane.
    smoke: connectivity/health, fail-fast.
    trades: places real orders on a LIVE env; run deliberately; no retries EVER.
    serial: ordered fee-tier flow; one process, phases share accumulated volume.
timeout = 300
timeout_func_only = true
