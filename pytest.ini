[pytest]
testpaths = suites tests
python_files = test_*.py
addopts = -ra -m "not trades and not serial"
; SAFETY RAIL: trading lanes are OPT-IN.
; default run = @stateless + @smoke + offline units. run trades explicitly:
;   pytest -m trades          (overrides the default marker filter)
;   pytest -m serial -p no:cacheprovider   (ordered flows: xdist-safe, see below)
; NEVER add a retry/rerun plugin to trades/serial — a retry re-places live orders.
; xdist (-n) is safe on all three lanes: `account`/`enrolled_account`/`spot_maker`/`perp_maker`
; (fixtures/accounts.py) are session-scoped == one per worker. serial's ordered/stateful
; test classes carry an explicit `@pytest.mark.xdist_group(name=...)` (built-in xdist marker,
; needs no registration here) so cross-test module state stays on one worker in order --
; run serial with `--dist loadgroup`. mark-injecting tests (test_tiered_reduction.py,
; test_liquidation_takeover.py) are additionally kept apart by using DISTINCT UAT markets per
; test, not by process count -- see CONVENTIONS.md known-gotchas for the market allocation.
; UI e2e tests are a separate Node project (e2e/), not part of this pytest suite at all —
; see e2e/README or AGENTS.md. `npm test` there, not pytest.
markers =
    stateless: independent, parallel-safe, no funding, no trades. default lane.
    smoke: connectivity/health, fail-fast.
    trades: places real orders on a LIVE env; run deliberately; no retries EVER.
    serial: ordered/stateful flow. xdist-safe with --dist loadgroup (see xdist_group markers).
timeout = 300
timeout_func_only = true
