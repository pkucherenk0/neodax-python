name: perp-spot-tests

# Runs the nimbus perp/spot API suites against live UAT on every push (any branch).
# See suites/nimbus/perp, suites/nimbus/spot. Not the PR merge gate — that's
# pr-check.yml (fast, safe-lane only). This one also covers PR branches via `push`
# (any commit pushed to a PR's branch triggers this too), so there's no separate
# pull_request trigger here — that would just double-run the same commit.
#
# NOTE: this deliberately runs @trades and @serial lanes too, which place REAL
# orders on live UAT and spend real (throwaway UAT) balance on every push. That
# was an explicit choice — see README.md "Safety rails" for what those markers
# mean before changing this file. Also runs the e2e/ UI suite (mock wallet, its own
# job, e2e-ui) — but ONLY on pushes to main (see that job's `if:`), since
# pr-check.yml already runs it (blocking) for PR-branch pushes, and running both
# concurrently races two live-order sessions against the same thin shared market.
#
# safe-lane/trades-lane/serial-lane are 3 SEPARATE jobs (own runner each), not 3
# sequential steps in one job -- they run concurrently. Safe to do so: trades-lane
# trades BTC/ETH (the default markets), serial-lane's mark-injecting tests use
# SUI/DOGE/BNB/LINK exclusively (see CONVENTIONS.md's UAT market allocation) --
# disjoint, so no cross-job collision. serial-lane is the long pole (~300s,
# dominated by test_tiered_reduction.py's own step-hold timing, not xdist worker
# count -- see CONVENTIONS.md known-gotchas); running the other two alongside it
# instead of before it removes their time from the critical path.

on:
  push:

# cancel a superseded run on the same branch so we don't stack overlapping
# live-trading runs against the same ref.
concurrency:
  group: perp-spot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIMBUS_UAT_BASE: ${{ secrets.NIMBUS_UAT_BASE }}
      NIMBUS_UAT_AUTH_BASE: ${{ secrets.NIMBUS_UAT_AUTH_BASE }}
      NIMBUS_UAT_TRADING_BASE: ${{ secrets.NIMBUS_UAT_TRADING_BASE }}
      NIMBUS_UAT_FAUCET_URL: ${{ secrets.NIMBUS_UAT_FAUCET_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        # No `playwright install` here: suites/nimbus/perp and suites/nimbus/spot
        # use Playwright's request context (pure HTTP, no browser). Browsers are
        # only needed for the e2e/ suite, run separately by the e2e-ui job below.

      - name: Safe lane (stateless + smoke, default addopts)
        run: pytest -n 4 suites/nimbus/perp suites/nimbus/spot suites/test_health.py suites/test_faucet_health.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-results-safe-${{ github.run_id }}
          path: results/latest
          if-no-files-found: ignore
          retention-days: 14

  trades-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIMBUS_UAT_BASE: ${{ secrets.NIMBUS_UAT_BASE }}
      NIMBUS_UAT_AUTH_BASE: ${{ secrets.NIMBUS_UAT_AUTH_BASE }}
      NIMBUS_UAT_TRADING_BASE: ${{ secrets.NIMBUS_UAT_TRADING_BASE }}
      NIMBUS_UAT_FAUCET_URL: ${{ secrets.NIMBUS_UAT_FAUCET_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Trades lane (places real orders on UAT)
        run: pytest -n 4 -m trades suites/nimbus/perp suites/nimbus/spot

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-results-trades-${{ github.run_id }}
          path: results/latest
          if-no-files-found: ignore
          retention-days: 14

  serial-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIMBUS_UAT_BASE: ${{ secrets.NIMBUS_UAT_BASE }}
      NIMBUS_UAT_AUTH_BASE: ${{ secrets.NIMBUS_UAT_AUTH_BASE }}
      NIMBUS_UAT_TRADING_BASE: ${{ secrets.NIMBUS_UAT_TRADING_BASE }}
      NIMBUS_UAT_FAUCET_URL: ${{ secrets.NIMBUS_UAT_FAUCET_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Serial lane (ordered/stateful flow, xdist_group-safe, no retries/cache)
        run: pytest -n 4 --dist loadgroup -m serial -p no:cacheprovider suites/nimbus/perp suites/nimbus/spot

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-results-serial-${{ github.run_id }}
          path: results/latest
          if-no-files-found: ignore
          retention-days: 14

  e2e-ui:
    # main only: pr-check.yml already runs this (blocking) for every PR-branch push. Both
    # workflows trigger on the same commit, and running this job twice concurrently races
    # two live-order browser sessions against the same thin shared UAT market -- one run's
    # full-book counterparty sweep can consume the other run's still-resting order. Confirmed
    # in practice: pr-check.yml's copy failed 3/3 times it ran concurrently with this one.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIMBUS_UAT_BASE: ${{ secrets.NIMBUS_UAT_BASE }}
      NIMBUS_UAT_AUTH_BASE: ${{ secrets.NIMBUS_UAT_AUTH_BASE }}
      NIMBUS_UAT_TRADING_BASE: ${{ secrets.NIMBUS_UAT_TRADING_BASE }}
      NIMBUS_UAT_FAUCET_URL: ${{ secrets.NIMBUS_UAT_FAUCET_URL }}
      NIMBUS_FE_BASE: ${{ secrets.NIMBUS_FE_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Python venv (global-setup.ts execs .venv/bin/python3)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser + OS deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Real UI e2e (mock wallet -- spot->perp transfer, order, API counterparty match, position visible)
        working-directory: e2e
        run: npm test

      - name: Upload e2e artifacts (screenshots + failure traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-push-${{ github.run_id }}
          # e2e/screenshots: our named takeScreenshot() checkpoints. e2e/test-results:
          # Playwright's own auto-screenshot + full trace (playwright.config.ts:
          # screenshot/trace 'on-failure') -- covers a failure ANYWHERE, not just the steps
          # we thought to instrument. `npx playwright show-trace <trace.zip>` replays it.
          path: |
            e2e/screenshots
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
