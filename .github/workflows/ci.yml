name: perp-spot-tests

# Runs the neodax perp/spot API suites against live UAT on every push (any branch).
# See suites/neodax/perp, suites/neodax/spot. Not the PR merge gate — that's
# pr-check.yml (fast, safe-lane only). This one also covers PR branches via `push`
# (any commit pushed to a PR's branch triggers this too), so there's no separate
# pull_request trigger here — that would just double-run the same commit.
#
# NOTE: this deliberately runs @trades and @serial lanes too, which place REAL
# orders on live UAT and spend real (throwaway UAT) balance on every push. That
# was an explicit choice — see README.md "Safety rails" for what those markers
# mean before changing this file. Also runs the real MetaMask e2e/ suite (its own
# job, e2e-ui) — but ONLY on pushes to main (see that job's `if:`), since
# pr-check.yml already runs it (blocking) for PR-branch pushes, and running both
# concurrently races two live-order sessions against the same thin shared market.

on:
  push:

# cancel a superseded run on the same branch so we don't stack overlapping
# live-trading runs against the same ref.
concurrency:
  group: perp-spot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perp-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        # No `playwright install` here: suites/neodax/perp and suites/neodax/spot
        # use Playwright's request context (pure HTTP, no browser). Browsers are
        # only needed for the e2e/ suite, run separately by the e2e-ui job below.

      - name: Safe lane (stateless + smoke, default addopts)
        run: pytest suites/neodax/perp suites/neodax/spot

      - name: Trades lane (places real orders on UAT)
        run: pytest -m trades suites/neodax/perp suites/neodax/spot

      - name: Serial lane (ordered flow, one process, no retries/cache)
        run: pytest -m serial -p no:cacheprovider suites/neodax/perp suites/neodax/spot

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neodax-results-${{ github.run_id }}
          path: results/latest
          if-no-files-found: ignore
          retention-days: 14

  e2e-ui:
    # main only: pr-check.yml already runs this (blocking) for every PR-branch push. Both
    # workflows trigger on the same commit, and running this job twice concurrently races
    # two live-order browser sessions against the same thin shared UAT market -- one run's
    # full-book counterparty sweep can consume the other run's still-resting order. Confirmed
    # in practice: pr-check.yml's copy failed 3/3 times it ran concurrently with this one.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Python venv (global-setup.ts execs .venv/bin/python3)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser + OS deps (+ xvfb for headed MetaMask popups)
        working-directory: e2e
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium

      - name: Real MetaMask e2e (spot->perp transfer, order, API counterparty match, position visible)
        working-directory: e2e
        run: xvfb-run --auto-servernum npm test

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-push-${{ github.run_id }}
          path: e2e/screenshots
          if-no-files-found: ignore
          retention-days: 14
