name: pr-check

# PR-blocking gate. Two required checks:
#  - safe-lane: fast (stateless + smoke), no live orders, no faucet spend.
#  - e2e-ui: real browser automation (mock EIP-1193 wallet, no real MetaMask extension) against
#    the deployed UAT FE, places real live orders on UAT. Deliberately blocking too (explicit
#    choice, heavier than safe-lane) -- see e2e/README / AGENTS.md for what the suite does.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIMBUS_UAT_BASE: ${{ secrets.NIMBUS_UAT_BASE }}
      NIMBUS_UAT_AUTH_BASE: ${{ secrets.NIMBUS_UAT_AUTH_BASE }}
      NIMBUS_UAT_TRADING_BASE: ${{ secrets.NIMBUS_UAT_TRADING_BASE }}
      NIMBUS_UAT_FAUCET_URL: ${{ secrets.NIMBUS_UAT_FAUCET_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Safe lane (stateless + smoke, default addopts)
        run: pytest -n 4 suites/nimbus/perp suites/nimbus/spot

  e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIMBUS_UAT_BASE: ${{ secrets.NIMBUS_UAT_BASE }}
      NIMBUS_UAT_AUTH_BASE: ${{ secrets.NIMBUS_UAT_AUTH_BASE }}
      NIMBUS_UAT_TRADING_BASE: ${{ secrets.NIMBUS_UAT_TRADING_BASE }}
      NIMBUS_UAT_FAUCET_URL: ${{ secrets.NIMBUS_UAT_FAUCET_URL }}
      NIMBUS_FE_BASE: ${{ secrets.NIMBUS_FE_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Python venv (global-setup.ts execs .venv/bin/python3)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser + OS deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Real UI e2e (mock wallet -- spot->perp transfer, order, API counterparty match, position visible)
        working-directory: e2e
        run: npm test

      - name: Upload e2e artifacts (screenshots + failure traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          # e2e/screenshots: our named takeScreenshot() checkpoints. e2e/test-results:
          # Playwright's own auto-screenshot + full trace (playwright.config.ts:
          # screenshot/trace 'on-failure') -- covers a failure ANYWHERE, not just the steps
          # we thought to instrument. `npx playwright show-trace <trace.zip>` replays it.
          path: |
            e2e/screenshots
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
