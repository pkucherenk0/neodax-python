name: pr-check

# PR-blocking gate. Two required checks:
#  - safe-lane: fast (stateless + smoke), no live orders. One exception: test_faucet_health.py
#    does a single tiny throwaway-UAT faucet deposit as a canary -- deliberate, so a faucet/
#    settlement outage (confirmed to happen; see its own docstring) fails fast here instead of
#    surfacing as confusing timeouts scattered across every @trades/@serial test downstream.
#  - e2e-ui: real browser automation (mock EIP-1193 wallet, no real MetaMask extension) against
#    the deployed UAT FE, places real live orders on UAT. Deliberately blocking too (explicit
#    choice, heavier than safe-lane) -- see e2e_py/README / AGENTS.md for what the suite does.
#    Runs e2e_py/ (Python/pytest POM port of the old Node e2e/ suite) -- CI has cut over, the
#    old e2e/ (Node) directory still sits on disk unused pending its own manual delete+rename
#    (e2e_py/ -> e2e/) once that's convenient; not run by CI anymore either way.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIMBUS_UAT_BASE: ${{ secrets.NIMBUS_UAT_BASE }}
      NIMBUS_UAT_AUTH_BASE: ${{ secrets.NIMBUS_UAT_AUTH_BASE }}
      NIMBUS_UAT_TRADING_BASE: ${{ secrets.NIMBUS_UAT_TRADING_BASE }}
      NIMBUS_UAT_FAUCET_URL: ${{ secrets.NIMBUS_UAT_FAUCET_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Safe lane (stateless + smoke, default addopts)
        run: pytest -n 4 suites/nimbus/perp suites/nimbus/spot suites/test_health.py suites/test_faucet_health.py

  e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIMBUS_UAT_BASE: ${{ secrets.NIMBUS_UAT_BASE }}
      NIMBUS_UAT_AUTH_BASE: ${{ secrets.NIMBUS_UAT_AUTH_BASE }}
      NIMBUS_UAT_TRADING_BASE: ${{ secrets.NIMBUS_UAT_TRADING_BASE }}
      NIMBUS_UAT_FAUCET_URL: ${{ secrets.NIMBUS_UAT_FAUCET_URL }}
      NIMBUS_FE_BASE: ${{ secrets.NIMBUS_FE_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up root venv (e2e_py/conftest.py shells out to tools/arrange_metamask_e2e.py)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Set up e2e_py venv + browser
        working-directory: e2e_py
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/playwright install --with-deps chromium

      - name: Real UI e2e (mock wallet -- spot->perp transfer, order, API counterparty match, position visible)
        working-directory: e2e_py
        run: .venv/bin/pytest -v

      - name: Upload e2e artifacts (screenshots + failure traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          # e2e_py/screenshots: our named take_screenshot() checkpoints. e2e_py/test-results:
          # pytest-playwright's own auto-screenshot + full trace (pytest.ini: --screenshot
          # only-on-failure --tracing retain-on-failure) -- covers a failure ANYWHERE, not just
          # the steps we thought to instrument. `playwright show-trace <trace.zip>` replays it.
          path: |
            e2e_py/screenshots
            e2e_py/test-results
          if-no-files-found: ignore
          retention-days: 14
