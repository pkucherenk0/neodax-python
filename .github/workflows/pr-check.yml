name: pr-check

# PR-blocking gate. Two required checks:
#  - safe-lane: fast (stateless + smoke), no live orders, no faucet spend.
#  - e2e-ui: real MetaMask (dappwright) browser automation against the deployed UAT FE,
#    places real live orders on UAT. Deliberately blocking too (explicit choice, heavier
#    than safe-lane) -- see e2e/README / AGENTS.md for what the suite does.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Safe lane (stateless + smoke, default addopts)
        run: pytest suites/neodax/perp suites/neodax/spot

  e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Python venv (global-setup.ts execs .venv/bin/python3)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser + OS deps (+ xvfb for headed MetaMask popups)
        working-directory: e2e
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium

      - name: Real MetaMask e2e (spot->perp transfer, order, API counterparty match, position visible)
        working-directory: e2e
        run: xvfb-run --auto-servernum npm test

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: e2e/screenshots
          if-no-files-found: ignore
          retention-days: 14
